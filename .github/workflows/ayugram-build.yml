name: AyuGram iOS build

# Telegram-iOS only builds on macOS with Xcode + Bazel, so this is the way to
# compile-check the fork from a Windows or Linux workstation.
on:
  push:
    branches: [main, master, ayugram]
  pull_request:
  workflow_dispatch:

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache Bazel output
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'versions.json') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build (debug simulator)
        env:
          TELEGRAM_CODESIGNING_GIT_PASSWORD: ${{ secrets.TELEGRAM_CODESIGNING_GIT_PASSWORD }}
        run: |
          python3 build-system/Make/Make.py --overrideXcodeVersion \
            --cacheDir ~/telegram-bazel-cache \
            build \
            --continueOnError \
            --configurationPath build-system/appstore-configuration.json \
            --gitCodesigningRepository "${{ secrets.TELEGRAM_CODESIGNING_REPOSITORY }}" \
            --gitCodesigningType development --gitCodesigningUseCurrent \
            --buildNumber=1 --configuration=debug_sim_arm64
